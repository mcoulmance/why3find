# ---------------------------------------------------------------------------
# --- Why3find GitLab - CI
# ---------------------------------------------------------------------------

stages:
  - build
  - distrib

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
          && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# --- Templates
# ---------------------------------------------------------------------------

.opam: &opam
  image: registry.frama-c.com/pub/why3find:v2@sha256:df5db8e48bbf2e2de4f762ea201cbee9116c458b14d1d9a0828c9ed163079c2a
  tags:
    - docker

.node: &node
  image: node:lts-buster
  cache:
    paths:
      - vscode/node_modules/
  tags:
    - docker

# ---------------------------------------------------------------------------
# --- Why3find
# ---------------------------------------------------------------------------

build:
  <<: *opam
  stage: build
  script:
    - opam update
    - opam install . --deps-only --jobs 2 --with-test --with-doc
    - make lint
    - make build
    - make test
    - make doc

why3-master:
  <<: *opam
  stage: distrib
  allow_failure: true
  script:
    - git merge origin/why3-master
    - opam pin -n https://gitlab.inria.fr/why3/why3.git#master
    - opam update
    - opam reinstall why3
    - opam install . --jobs 2 --with-test --with-doc

opam-distrib:
  stage: distrib
  when: manual
  image: ocaml/opam:ubuntu-lts-ocaml-4.14
  variables:
    OPAMDOWNLOADJOBS: "1"
    OPAMERRLOGLEN: "0"
    OPAMSOLVERTIMEOUT: "500"
    OPAMPRECISETRACKING: "1"
  script:
    - sudo ln -f /usr/bin/opam-2.1 /usr/bin/opam
    - opam --version
    - opam init --reinit -ni
    - sudo apt update
    - export OPAMCRITERIA="-removed,-count[avoid-version,changed],-count[version-lag,request],-count[version-lag,changed],-count[missing-depexts,changed],-changed"
    - export OPAMFIXUPCRITERIA="-removed,-count[avoid-version,changed],-count[version-lag,request],-count[version-lag,changed],-count[missing-depexts,changed],-changed"
    - export OPAMUPGRADECRITERIA="-removed,-count[avoid-version,changed],-count[version-lag,request],-count[version-lag,changed],-count[missing-depexts,changed],-changed"
    - opam pin . -n -k path
    - opam update --depexts
    - opam depext --jobs 2 frama-c
    - export OPAMCRITERIA="+removed,+count[version-lag,solution]"
    - export OPAMFIXUPCRITERIA="+removed,+count[version-lag,solution]"
    - export OPAMUPGRADECRITERIA="+removed,+count[version-lag,solution]"
    - export OPAMEXTERNALSOLVER="builtin-0install"
    - opam update --depexts
    - opam reinstall --jobs 2 frama-c
    - frama-c --plugins
  timeout: 2h
  tags:
    - docker

# ---------------------------------------------------------------------------
# --- VSCode Extension
# ---------------------------------------------------------------------------

vscode:
  <<: *node
  stage: build
  script:
    - node --version
    - npm --version
    - yarn --version
    - make --version
    - make -C vscode

vscode-extension:
  <<: *node
  stage: distrib
  when: manual
  script:
    - make -C vscode package
  artifacts:
    paths:
      - vscode/why3-platform-*.vsix

# ---------------------------------------------------------------------------
