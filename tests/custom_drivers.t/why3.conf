[main]
default_editor = "xdg-open %f"
magic = 14
memlimit = 1000
running_provers_max = 4
timelimit = 5.000000

[prover]
command = "'/nonexistent/alt-ergo' --timelimit %.t %f"
command_steps = "'/nonexistent/alt-ergo' --steps-bound=%S %f"
driver = "custom.drv"
editor = "altgr-ergo"
in_place = false
interactive = false
name = "Alt-Ergo"
shortcut = "altergo"
shortcut = "alt-ergo"
version = "2.4.2"
